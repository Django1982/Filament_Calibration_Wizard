services:
  perfectfit:
    # No prebuilt image is published — `build` makes Compose build it from this repo.
    build: .
    image: perfectfit:latest
    container_name: perfectfit
    restart: unless-stopped
    networks:
      - containers
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.perfectfit.rule=Host(`perfectfit.mynetwork.net`)"
      - "traefik.http.routers.perfectfit.tls=true"
      - "traefik.http.routers.perfectfit.tls.certresolver=letsencrypt"
      - "traefik.http.services.perfectfit.loadbalancer.server.port=80"
    environment:
      - PERFECTFIT_API_TOKEN=${PERFECTFIT_API_TOKEN:-}
    volumes:
      - perfectfit-data:/data

networks:
  containers:
    name: containers
    driver: bridge
    attachable: true
    driver_opts:
      com.docker.network.bridge.name: br-containers

volumes:
  perfectfit-data: