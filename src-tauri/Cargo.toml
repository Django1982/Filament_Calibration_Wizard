[package]
name = "app"
version = "1.3.2"
description = "Filament Calibration Wizard"
authors = ["Aaron Taylor"]
license = "AGPL-3.0-only"
repository = "https://github.com/tayloraaron078-tech/Filament_Calibration_Wizard"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
sha2 = "0.10"
# Assemble Orca project 3mf files (a 3mf is a zip). Lean feature set: only the
# deflate codec Orca projects use — no bzip2/zstd/aes/lzma.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Download-on-demand of the pinned managed OrcaSlicer (Stage 9). Blocking client
# with pure-Rust rustls TLS (no OpenSSL) — fits the blocking process runner. No
# gzip/json/cookies features: we stream one binary asset to disk and hash it.
ureq = { version = "2", default-features = false, features = ["tls"] }
